[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-axis"
version = "0.1.0"
description = "Explaining multivariate time-series anomalies with detector-derived contextual evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.5",
  "transformers>=4.57.1,<4.58",
  "numpy>=1.21,<3",
  "Pillow>=10",
  "matplotlib>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
